# Agent -> Meta model mapping (PRODUCTION / provider "meta").
# Used ONLY when PROVIDER=meta. Until billing is live the pilot runs on the DEV provider
# (config/models.dev.yaml). See docs/TRANSPOSE_TO_META.md.
#
# VERIFIED 2026-10-27 against the live Meta Model API catalog (GET https://api.meta.ai/v1/models)
# using Troy's own API key. The key authenticates; the ONLY remaining blocker is account billing
# (a valid payment method must be on file — see STATUS.md). Real catalog returned:
#   muse-spark-1.3, muse-spark-1.3-contributor, muse-spark-1.2, muse-spark-1.2-contributor,
#   muse-spark-1.1, muse-wonder-1.0, muse-image-1.0, muse-voice-transcribe-1.0, sam-3.1
# The earlier placeholder names (muse-spark, muse-spark-open-1026) do NOT exist and are replaced.
#
# OPEN-WEIGHT ROUTING (VERIFIED 2026-11-03 against the live Meta Model API):
# muse-spark-1.3-contributor is the open-weight / community Muse Spark model. It is present in the
# live catalog AND a real completion against it succeeded (id chatcmpl-01a19f99..., real token
# usage reported). The three highest-volume agents (intake, filtering, database) are routed to it
# to qualify for the "Best Build on Meta Open-Weight Models" bonus. The five reasoning-heavy
# agents (phenotype, literature, case_matching, red_team, dossier_writer) stay on muse-spark-1.3.
# This is a YAML-only change — no agent code mentions a model name (see src/models/config.py).

agents:
  intake:
    model: muse-spark-1.3-contributor   # open-weight
    role: "Parse VCF / demo case, normalize variants"
    isolated: true
  filtering:
    model: muse-spark-1.3-contributor   # open-weight
    role: "Reduce candidate variants by frequency / quality"
    isolated: true
  phenotype:
    model: muse-spark-1.3
    role: "Map clinical picture to HPO phenotype terms"
    isolated: true
  literature:
    model: muse-spark-1.3
    role: "Search and summarize relevant publications"
    isolated: true
  database:
    model: muse-spark-1.3-contributor   # open-weight
    role: "Query OMIM / Orphanet / ClinVar / gnomAD"
    isolated: true
  case_matching:
    model: muse-spark-1.3
    role: "Compare case against known solved cases"
    isolated: true
  red_team:
    model: muse-spark-1.3
    role: "Challenge conclusions, flag uncertainty (independent, isolated context)"
    isolated: true
  dossier_writer:
    model: muse-spark-1.3
    role: "Assemble the physician-facing evidence dossier"
    isolated: true

# Muse Code is used to BUILD the platform, not as a runtime agent.
