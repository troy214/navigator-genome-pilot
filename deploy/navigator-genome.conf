# Navigator Genome Pilot — public vhost
# Public URL: https://navigator-genome.abacusai.cloud  ->  server_name navigator-genome.vm.internal
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name navigator-genome.vm.internal;

    # API responses should not be edge-cached; allow brief caching of the static page.
    add_header Cache-Control "max-age=0, s-maxage=60";
    # Allow embedding in the Abacus apps preview iframe.
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.abacus.ai";

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $http_x_original_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
